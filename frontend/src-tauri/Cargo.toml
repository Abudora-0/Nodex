[package]
name = "nodex"
version = "0.1.0"
description = "Nodex desktop: save editing, repair and walkthroughs for visual novels"
authors = ["Abudora-0"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

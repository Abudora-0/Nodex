[project]
name = "nodex"
version = "0.1.0"
description = "Visual novel save repair, variable editing, walkthrough and gallery modding toolkit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
nodex = "nodex.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nodex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
